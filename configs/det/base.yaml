defaults: [../data.yaml]
patch_zyx: [80, 192, 192]        # 必须能被所有层 stride 整除
pos_fraction: 0.5
pos_jitter_mm: 10
augment:
  flip_axes: [0, 1, 2]
  intensity: {scale: 0.1, shift: 0.05}   # 在归一化强度尺度 [0,1] 上定义
  rotate: false
sampling: {align_corners: false}
model:
  dim: 256
  backbone: {type: resnet18_fpn, levels: [2, 4, 8]}
  heatmap: {level: 4, n_q: 64, nms_kernel: 3}   # level 可改为 2
  decoder: {layers: 3, heads: 8, local_grid: 7, local_extent_scale: 1.5,
            local_extent_min_mm: 10, use_global: true}
  recovery: {enabled: true, crop_mm: 32, out_size: 32, dilate_vox: 2}   # 以 GT 中心的固定 32 mm 立方体，1 mm 体素
loss:
  match_cost: {cls: 2.0, l1: 5.0, giou: 2.0}
  aux_match: final          # final | per_layer
  exist_focal: {alpha: 0.25, gamma: 2.0}
  w: {hm: 1.0, size: 0.1, exist: 2.0, l1: 5.0, giou: 2.0, local: 1.0}
optim: {type: adamw, lr_decoder: 2.0e-4, lr_backbone: 1.0e-4, wd: 1.0e-4,
        warmup_iters: 1000, schedule: cosine, clip_norm: 1.0}
train: {batch: 4, accum_steps: 1, iters: 30000, amp: true, val_every: 2000, workers: 4}   # BF16 不使用动态梯度缩放；batch 为全局 batch
infer: {overlap: 0.25, p_min: 0.05, nms: center_distance, nms_radius_scale: 0.5, window_core: true}   # window_core 见 data/infer_dataset.py；eval.window_core 对照
adapt:
  iters: 2000               # 本轮共同预算：仅按 Lung1 验证覆盖触发，D1/D2相同，不用测试集选择
seeds: {init: 1000, recovery_init: 1001, data: 2000}
init_ckpt: /data/tanyuejun/_shared/checkpoints/LeCen/init.pt
ddp: {zero_loss_for_unused: true}
