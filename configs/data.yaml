paths:
  raw_luna16: /data/tanyuejun/LUNA16/processed/LeCen/_scratch/raw_workspace  # 包含原始 ZIP 的软链接；解压也在此目录
  luna16_seg: /data/tanyuejun/LUNA16/raw/seg_lungs/seg-lungs-LUNA16
  luna16_annotations: /data/tanyuejun/LUNA16/meta/annotations.csv
  luna16_excluded: /data/tanyuejun/LUNA16/raw/evaluation/evaluationScript/annotations/annotations_excluded.csv
  luna16_evaluation_script: /home/tanyuejun/LeCen_runtime/luna16_official_py3/noduleCADEvaluationLUNA16.py
  clinical_meta: /data/tanyuejun/_shared/clinical/LeCen/lung1_external_v1_20261030/meta           # 合并后的临床表、划分、肿瘤框与 crops（make_splits --part clinical 写出；新目录，不覆盖已冻结的 ACRIN 元数据）
  clinical_processed: /data/tanyuejun/_shared/clinical/LeCen/lung1_external_v1_20261030/processed      # 两个队列预处理后的 clinical/<patient_id>.nii.gz 与 clinical_targets/
  lungmask_checkpoint: /data/tanyuejun/_shared/weights/lungmask/unet_r231-d5d2fc3d.pth
  processed: /data/tanyuejun/LUNA16/processed/LeCen
  meta: /data/tanyuejun/LUNA16/meta/LeCen
  cache: /data/tanyuejun/_shared/cache/LeCen_lung1_external_v1_20261030  # 新协议独立缓存；LUNA tokens链接复用，旧ACRIN缓存保留
preprocess:
  version: lecen_pp_v1_ctclip_v2_mean12_20261028
  spacing_zyx: [1.25, 0.703125, 0.703125]
  hu_clip: [-1000, 400]         # x = (clip(HU) + 1000) / 1400
  crop:
    luna:
      mode: lung_bbox           # 肺外接框裁剪，不对肺外像素清零
      margin_mm: 10.0           # 已按训练集确定，与现有 888 例预处理和 token 缓存一致
      safety_mm: 5
      fit_margins_mm: [0, 5, 10, 15, 20, 25, 30]
      lung_labels: [3, 4]       # seg-lungs-LUNA16 左右肺
    clinical:
      mode: lung_bbox
      margin_mm: 30             # 在临床训练集上确认后固定
      lung_labels: [1, 2]       # lungmask 左右肺
    fallback:                   # 只依据图像与分割质量，不看病灶位置
      lung_volume_ml: [1000, 10000]
      min_bbox_mm_zyx: [100, 120, 150]
      require_both_lungs: true
      fallback_mode: body_bbox  # HU 阈值 + 最大连通域
      body_hu: -500
ctclip:
  checkpoint: /data/tanyuejun/_shared/weights/ctclip/CT-CLIP_v2.pt
  token_layer: ""               # encoder 本身；与现有缓存一致，输出 (1, 24, 24, 24, 512)
  pooled_grid: [12, 12, 12]
  dtype: float16
clinical:
  development: lung1          # 该队列做 train/val/test 划分；其余队列整体为外部测试（split = external）
  covariates: [age, sex_male, stage]   # 各队列统一格式 clinical.csv 中的列；stage 为类别（I / II / IIIA / IIIB / other）
  cohorts:
    lung1:                    # NSCLC-Radiomics（MAASTRO），data/prep_lung1.py
      collection: nsclc_radiomics
      raw: /data/tanyuejun/NSCLC-Radiomics/dicom                # IDC 下载的 CT 与 RTSTRUCT（patient_id/study_uid/series_uid/）
      prep: /data/tanyuejun/NSCLC-Radiomics/preparation/LeCen_lung1_external_v1_20261030  # clinical.csv、series.csv、tumors.csv（GTV-1 框）
    acrin:                    # ACRIN 6668 外部测试，data/prep_acrin.py
      collection: acrin_nsclc_fdg_pet
      raw: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/dicom   # patient_id/study_uid/series_uid/
      frozen_meta: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/preparation/verified_v1_20261029/model_inputs/meta  # 已冻结的 115 例模型输入
      prep: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/preparation/LeCen_lung1_external_v1_20261030  # clinical.csv、series.csv、tumors.csv（BAMF-AIMI 框，只用于覆盖率报告）
      bamf: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/annotations/BAMF-AIMI/dicom               # IDC 下载的 BAMF-AIMI DICOM SEG
splits:
  det: {train: [0, 1, 2, 3, 4, 5, 6], val: [7], test: [8, 9]}
  clin: {ratios: [0.6, 0.2, 0.2], stratify: [event, treatment], seed: 2026}
