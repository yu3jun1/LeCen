paths:
  raw_luna16: /data/tanyuejun/LUNA16/processed/LeCen/_scratch/raw_workspace  # 包含原始 ZIP 的软链接；解压也在此目录
  luna16_seg: /data/tanyuejun/LUNA16/raw/seg_lungs/seg-lungs-LUNA16
  luna16_annotations: /data/tanyuejun/LUNA16/meta/annotations.csv
  luna16_excluded: /data/tanyuejun/LUNA16/raw/evaluation/evaluationScript/annotations/annotations_excluded.csv
  luna16_evaluation_script: /home/tanyuejun/LeCen_runtime/luna16_official_py3/noduleCADEvaluationLUNA16.py
  raw_clinical: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/dicom  # patient_id/study_uid/series_uid/
  clinical_series: null      # 待核验：正式 CSV 必须为 patient_id,series_uid，一患者一行；不能使用下方候选表替代
  clinical_series_candidates: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/preparation/meta/acrin_baseline_series.csv
  clinical_table: /data/tanyuejun/ACRIN-NSCLC-FDG-PET/preparation/meta/clinical_acrin.csv
  processed: /data/tanyuejun/LUNA16/processed/LeCen
  meta: /data/tanyuejun/LUNA16/meta/LeCen
  cache: /data/tanyuejun/_shared/cache/LeCen
preprocess:
  version: lecen_pp_v1_ctclip_v2_mean12_20261028
  spacing_zyx: [1.25, 0.703125, 0.703125]
  hu_clip: [-1000, 400]         # x = (clip(HU) + 1000) / 1400
  crop:
    luna:
      mode: lung_bbox           # 肺外接框裁剪，不对肺外像素清零
      margin_mm: 10.0           # 已按训练集确定，与现有 888 例预处理和 token 缓存一致
      safety_mm: 5
      fit_margins_mm: [0, 5, 10, 15, 20, 25, 30]
      lung_labels: [3, 4]       # seg-lungs-LUNA16 左右肺
    clinical:
      mode: lung_bbox
      margin_mm: 30             # 在临床训练集上确认后固定
      lung_labels: [1, 2]       # lungmask 左右肺
    fallback:                   # 只依据图像与分割质量，不看病灶位置
      lung_volume_ml: [1000, 10000]
      min_bbox_mm_zyx: [100, 120, 150]
      require_both_lungs: true
      fallback_mode: body_bbox  # HU 阈值 + 最大连通域
      body_hu: -500
ctclip:
  checkpoint: /data/tanyuejun/_shared/weights/ctclip/CT-CLIP_v2.pt
  token_layer: ""               # encoder 本身；与现有缓存一致，输出 (1, 24, 24, 24, 512)
  pooled_grid: [12, 12, 12]
  dtype: float16
clinical:
  collection: acrin_nsclc_fdg_pet
  columns:
    patient_id: patient_id
    time_days: ???              # 相对统一时间起点的天数
    event: ???
    treatment: ???
  event_values: ???             # 原始事件列中表示事件发生的取值
  censor_values: ???            # 表示删失的取值；两者之外的取值视为结局未知，不进入合格队列
  covariates: ???               # 临床协变量列名
splits:
  det: {train: [0, 1, 2, 3, 4, 5, 6], val: [7], test: [8, 9]}
  clin: {ratios: [0.6, 0.2, 0.2], stratify: [event, treatment], seed: 2026}
